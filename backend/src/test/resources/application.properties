# H2 in-memory database for automated tests
spring.datasource.url=jdbc:h2:mem:framehost_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable SQL initialization during tests
spring.sql.init.mode=never

# CORS configuration for tests
framehost.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# WebSocket allowed origins for tests
framehost.websocket.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
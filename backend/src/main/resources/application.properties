spring.application.name=framehost-backend

# Load local environment variables from backend/.env
spring.config.import=optional:file:.env[.properties]

# Server configuration (Render provides PORT)
server.port=${PORT:8080}

# PostgreSQL database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# REST API CORS configuration
framehost.cors.allowed-origins=${FRAMEHOST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# WebSocket CORS configuration
framehost.websocket.allowed-origins=${FRAMEHOST_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Expose database health details through Actuator
management.endpoints.web.exposure.include=health

# Show health component details
management.endpoint.health.show-details=never

# Include database health in the health response
management.health.db.enabled=true
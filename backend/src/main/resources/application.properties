spring.application.name=framehost-backend

# Load local environment variables from backend/.env
spring.config.import=optional:file:.env[.properties]

# Server configuration (Render provides PORT)
server.port=${PORT:8080}

# PostgreSQL database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# REST API CORS configuration
framehost.cors.allowed-origins=${FRAMEHOST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# WebSocket CORS configuration
framehost.websocket.allowed-origins=${FRAMEHOST_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Expose database health details through Actuator
management.endpoints.web.exposure.include=health

# Show health component details
management.endpoint.health.show-details=never

# Include database health in the health response
management.health.db.enabled=true

# ==========================================
# FrameHost - Local Media Upload Configuration
# ==========================================

# Directory used to store uploaded video files
framehost.media.storage-dir=${FRAMEHOST_MEDIA_STORAGE_DIR:./data/media}

# Maximum video upload size: 2 GB
framehost.media.max-file-size-bytes=${FRAMEHOST_MEDIA_MAX_FILE_SIZE_BYTES:2147483648}

# Upload chunk size: 4 MB
framehost.media.chunk-size-bytes=${FRAMEHOST_MEDIA_CHUNK_SIZE_BYTES:4194304}

# Upload session expiry: 24 hours
framehost.media.upload-expiry-hours=${FRAMEHOST_MEDIA_UPLOAD_EXPIRY_HOURS:24}